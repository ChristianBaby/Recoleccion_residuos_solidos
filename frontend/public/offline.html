<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sin conexión — Sistema de Recolección</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      padding: 40px 32px;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
    }
    .icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 20px;
      display: block;
    }
    h1 { font-size: 1.35rem; margin-bottom: 10px; color: #0f766e; }
    p { font-size: 0.95rem; line-height: 1.6; color: #475569; margin-bottom: 24px; }
    button {
      background: #0f766e;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #115e59; }
  </style>
</head>
<body>
  <div class="card">
    <img class="icon" src="/icons/icon-192.png" alt="Recolección de Residuos" />
    <h1>Sin conexión a internet</h1>
    <p>
      No pudimos cargar esta página. Revisa tu conexión e inténtalo de nuevo.
      Si reportaste una incidencia sin conexión, se enviará automáticamente
      cuando vuelvas a estar en línea.
    </p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
